name: Extração LogCTe

on:
  workflow_dispatch:
    inputs:
      cnpj:
        description: 'CNPJ do Emissor para buscar (apenas números ou com pontuação)'
        required: true
        type: string

jobs:
  run-bot:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout do código
      uses: actions/checkout@v4

    - name: Configurar o Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Instalar Google Chrome
      run: |
        sudo apt-get update
        sudo apt-get install -y google-chrome-stable

    - name: Instalar dependências
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Executar Automação
      env:
        LOGCTE_EMAIL: ${{ secrets.LOGCTE_EMAIL }}
        LOGCTE_PASSWORD: ${{ secrets.LOGCTE_PASSWORD }}
      run: |
        python Validar_Modelo_Cloud.py --cnpj "${{ github.event.inputs.cnpj }}"

    - name: Upload da Planilha Gerada
      uses: actions/upload-artifact@v4
      with:
        name: Resultado-LogCTe-${{ github.event.inputs.cnpj }}
        path: "*.xlsx"
